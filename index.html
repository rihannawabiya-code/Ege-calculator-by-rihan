<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rihan's Live Age Calculator — Exact Age (Live)</title>
  <meta name="description" content="Rihan's Live Age Calculator: पता करें अपनी सटीक उम्र — साल, महीने, दिन, घंटे, मिनट और सेकंड (real-time). Mobile-friendly & PWA.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300d2ff'/%3E%3Ctext x='50' y='58' font-size='48' text-anchor='middle' font-family='Arial' fill='%23000'%3ER%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#1e1e1e">

  <!-- Open Graph -->
  <meta property="og:title" content="Rihan's Live Age Calculator">
  <meta property="og:description" content="Calculate your exact age live (years, months, days, hours, minutes, seconds).">
  <meta property="og:type" content="website">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Rihan's Live Age Calculator",
    "url": "https://example.com/",
    "description": "Calculate your exact age in years, months, days, hours, minutes and seconds."
  }
  </script>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Rihan's Live Age Calculator 🚀</h1>
    <p class="muted">Apna janam din aur (optional) samay daaliye — age realtime update hogi.</p>

    <form id="ageForm" novalidate>
      <label for="birthDate">Date of Birth</label>
      <input type="date" id="birthDate" name="birthDate" required aria-describedby="hint">
      <label for="birthTime" class="optional">Time of Birth (optional)</label>
      <input type="time" id="birthTime" name="birthTime" class="small" aria-describedby="hintTime">
      <div class="controls">
        <button type="submit" id="calcBtn">Umar Btao!</button>
        <button type="button" id="clearBtn" class="secondary">Clear</button>
      </div>
      <div id="hint" class="muted">Date required. Time optional — agar na daalo to midnight se count hoga.</div>
    </form>

    <section id="output" aria-live="polite" aria-atomic="true">
      <p id="result" class="result"></p>
      <p id="metaResult" class="small muted"></p>
    </section>
  </main>

  <script src="script.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{/* ignore */});
    }
  </script>
</body>
</html>
